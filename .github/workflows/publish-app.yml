name: Publish app to GitHub Pages

# This repo's GitHub Pages is configured to serve the `main` branch's root
# (legacy "Deploy from a branch" mode), not the newer Actions-based Pages
# deploy — so instead of actions/deploy-pages, this workflow builds app/
# and commits the built site straight into the repo root, where Pages
# already picks it up. index.html / assets/ / skins/ / .nojekyll at the
# root are generated by this workflow — don't hand-edit them.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/publish-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-app
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Publish build output to repo root
        run: |
          set -e
          # Everything the build outputs (index.html, assets, skins, icons, sw.js,
          # manifest.webmanifest …) goes to the root — not a hand-kept list, which
          # once left sw.js/manifest/icons unpublished and broke iPhone notifications.
          published=$(ls -A app/dist)
          rm -rf $published
          cp -r app/dist/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- $published .nojekyll
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Publish built app to GitHub Pages [skip ci]"
            git push
          fi
