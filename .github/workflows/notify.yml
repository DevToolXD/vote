name: Notifications

# Background worker (.github/scripts/send-notifications.mjs): push notifications
# for new messages, received votes and 상담 messages, plus admin password resets.
# It also re-checks the Firestore rules once an hour (deploying only if the live
# rules differ from firestore.rules on main) and purges deleted accounts' logins.
#
# GitHub's scheduled (cron) runs never fire reliably for this repo, so the worker
# keeps itself alive instead: each run polls Firestore every 10 s for ~25 minutes,
# then starts the next run (workflow_dispatch with the built-in token is allowed
# to trigger workflows). Pushing changes to the worker, the schedule below (when
# GitHub does run it) and the Firebase backend workflow all (re)start the chain;
# the concurrency group keeps it to one run plus at most one waiting.

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/notify.yml'
      - '.github/scripts/send-notifications.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts
            firestore.rules
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Firestore rules (re-deployed hourly if they differ from main)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ "$(date -u +%M)" -lt 30 ] || [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            SKIP_IF_SAME=1 node .github/scripts/deploy-firestore-rules.mjs
          else
            echo "Checked in the first half of the hour."
          fi
      - name: Remove logins of deleted accounts
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/purge-deleted-accounts.mjs
      - name: Send notifications, apply password resets
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RUN_FOR_MS: '1500000'
          POLL_MS: '10000'
        run: node .github/scripts/send-notifications.mjs
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run notify.yml --ref main --repo "$GITHUB_REPOSITORY"
