name: Notifications

# Background worker (.github/scripts/send-notifications.mjs): push notifications
# for new messages, received votes and 상담 messages, plus admin password resets.
# It also re-checks the Firestore rules once an hour (deploying only if the live
# rules differ from firestore.rules on main) and purges deleted accounts' logins.
#
# It doesn't poll: firebase-admin real-time listeners report every change and carry
# all it needs (Firestore's free plan allows 50,000 reads a day; polling every 10 s
# once used them all up). GitHub's scheduled (cron) runs never fire reliably for this
# repo, so the worker keeps itself alive instead: each run lasts ~5.5 hours (or until
# newer code lands on main), then starts the next run (workflow_dispatch with the
# built-in token is allowed to trigger workflows). Pushing changes to the worker, the
# schedule below (when GitHub does run it) and the Firebase backend workflow all
# (re)start the chain; the concurrency group keeps it to one run plus at most one waiting.

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/notify.yml'
      - '.github/scripts/send-notifications.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Note the start time
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts
            firestore.rules
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install worker dependencies
        run: npm ci --prefix .github/scripts --no-audit --no-fund
      - name: Firestore rules (re-deployed hourly if they differ from main)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ "$(date -u +%M)" -lt 30 ] || [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            SKIP_IF_SAME=1 node .github/scripts/deploy-firestore-rules.mjs
          else
            echo "Checked in the first half of the hour."
          fi
      - name: Remove logins of deleted accounts
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/purge-deleted-accounts.mjs
      - name: Send notifications, apply password resets
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # ~5.5 hours per run (public repos have no Actions minute limit): every start-up
          # re-reads settings and push tokens, so fewer start-ups = fewer Firestore reads.
          # The worker hands over early when newer code lands on main.
          RUN_FOR_MS: '19800000'
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/send-notifications.mjs
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        # If the worker stopped early (e.g. Firestore's daily quota is used up),
        # wait so a run lasts at least 5 minutes instead of restarting in a tight loop.
        run: |
          left=$(( JOB_STARTED + 300 - $(date +%s) ))
          if [ "$left" -gt 0 ]; then echo "Stopped early; waiting ${left}s before the next run"; sleep "$left"; fi
          gh workflow run notify.yml --ref main --repo "$GITHUB_REPOSITORY"
