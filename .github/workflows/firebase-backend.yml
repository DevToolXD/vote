name: Firebase backend

# 1. Tests firestore.rules against the Firestore emulator using the app's own
#    backend code (app/tests/rules.test.ts) — nothing deploys if this fails.
# 2. Deploys the rules, makes sure Email/Password sign-in is on.
# 3. Runs an end-to-end smoke test against the live project (sign up → save →
#    vote → admin grant with 3 single-use tokens, plus what must be refused).
# Results show up as annotations on the run.

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - '.github/scripts/**'
      - '.github/workflows/firebase-backend.yml'
      - 'app/src/backend/**'
      - 'app/tests/**'
      - 'firebase.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-backend
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Rules tests (emulator)
        working-directory: app
        run: npm ci && npm run test:rules
      - name: Deploy Firestore rules
        run: node .github/scripts/deploy-firestore-rules.mjs
      - name: Migrate vote docs to the weekly-추천 format
        run: node .github/scripts/migrate-votes.mjs
      - name: Check Authentication settings
        run: node .github/scripts/setup-auth.mjs
      - name: End-to-end smoke test
        run: node .github/scripts/smoke-test.mjs
