name: Android APK

# Builds the Galaxy/Android app and publishes it as the `android-latest` release,
# which the site's "앱 설치하기 → 갤럭시" button links to. The app is a Capacitor
# shell that loads https://devtoolxd.github.io/vote/, so site updates show up in
# the app without a new APK; this only needs to run when the shell itself changes.

on:
  push:
    branches: [main]
    paths:
      - 'app/capacitor.config.json'
      - 'app/android-res/**'
      - 'app/package.json'
      - '.github/scripts/android-branding.sh'
      - '.github/workflows/android-apk.yml'
      - '.github/scripts/android-firebase-config.mjs'
      - '.github/scripts/android-signing.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install and build web assets
        run: npm ci && npm run build
      - name: Generate Android project
        run: npx cap add android && bash ../.github/scripts/android-branding.sh
      - name: Firebase config for push notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node ../.github/scripts/android-firebase-config.mjs android/app/google-services.json
      - name: Sync Capacitor plugins
        run: npx cap sync android
      - name: Version (so each APK installs as an update)
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Signing key (same key every build)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
        run: bash ../.github/scripts/android-signing.sh
      # Signed with apksigner (v1 + v2 + v3): Android 11+ refuses an app targeting it that only has
      # the old JAR (v1) signature — "패키지를 파싱하는 중 문제가 발생했습니다".
      - name: Build release APK
        run: cd android && ./gradlew --no-daemon assembleRelease
      - name: Align and sign (v1 + v2 + v3)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          U=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$U" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KEY_PASS --ks-key-alias vote --key-pass env:KEY_PASS \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out popular-vote.apk aligned.apk
          "$BT/apksigner" verify --verbose popular-vote.apk | head -8
      # Proof it really installs: boot Android emulators (the oldest supported version and a recent
      # one), install the APK, start it and check it's running. Nothing is published otherwise.
      - name: Enable KVM (for the emulator)
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: app
          script: |
            adb install -r popular-vote.apk
            adb shell monkey -p io.github.devtoolxd.vote -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell pidof io.github.devtoolxd.vote
      - name: Install and launch on Android 7 (the oldest supported)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          target: default
          working-directory: app
          script: |
            adb install -r popular-vote.apk
            adb shell monkey -p io.github.devtoolxd.vote -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell pidof io.github.devtoolxd.vote
      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la popular-vote.apk
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest popular-vote.apk --clobber
          else
            gh release create android-latest popular-vote.apk --target main \
              --title "인기투표 안드로이드 앱" \
              --notes "갤럭시/안드로이드용 설치 파일이에요. 사이트의 '앱 설치하기 → 갤럭시'에서 받을 수 있어요."
          fi
      # The site links to this copy (same address as the site: no redirects to another server,
      # which some in-app browsers and download managers trip over).
      - name: Serve it from the site too
        working-directory: .
        run: |
          cp app/popular-vote.apk popular-vote.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add popular-vote.apk
          git commit -m "Publish Android APK to GitHub Pages [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep $((i * 5)); done
